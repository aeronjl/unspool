[project]
name = "behavio"
version = "0.1.0"
description = "Fit and falsify trial-level models of behaviour - psychometric curves, GLM-HMMs, drift-diffusion models of choice and response time, reinforcement-learning agents, and hierarchical learning trajectories - with simulation, parameter and model recovery, and time-aware validation built into the fitting interface."
readme = "README.md"
authors = [
    { name = "Aeron Laffere" },
]
requires-python = ">=3.11"
license = "MIT"
keywords = [
    "behavioral-neuroscience",
    "cognitive-modeling",
    "drift-diffusion",
    "glm-hmm",
    "longitudinal-data",
    "model-recovery",
    "psychometric-function",
    "reinforcement-learning",
    "response-time",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.15",
]

[project.urls]
Homepage = "https://github.com/aeronjl/behavio"
Issues = "https://github.com/aeronjl/behavio/issues"
Repository = "https://github.com/aeronjl/behavio"

[project.scripts]
behavio = "behavio.cli:main"

[project.optional-dependencies]
nwb = [
    "h5py>=3.11",
    "pynwb>=3.1",
]
dandi = [
    "h5py>=3.11",
    "pynwb>=3.1",
    "remfile>=0.1",
]
ibl = [
    "one-api>=3.5,<4",
]
optimization = [
    "pybads>=1.0.6,<2",
]
probabilistic = [
    "arviz>=0.22,<1.2 ; python_full_version < '3.12'",
    "arviz>=1.2,<2 ; python_full_version >= '3.12'",
]
bayesian = [
    "pymc>=5.28,<6 ; python_full_version < '3.12'",
    "pymc>=6.1,<7 ; python_full_version >= '3.12'",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]
docs = [
    "matplotlib>=3.9",
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.29",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.10.12,<0.12.0"

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers", "-m", "not slow"]
markers = [
    "slow: re-executes a committed benchmark at its committed scale; run nightly, not by default",
]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
