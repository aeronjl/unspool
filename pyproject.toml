[project]
name = "unspool"
version = "0.1.0"
description = "A process-first framework for fitting and falsifying behavioural models across learning."
readme = "README.md"
authors = [
    { name = "Aeron Laffere" },
]
requires-python = ">=3.11"
license = "MIT"
keywords = [
    "behavioral-neuroscience",
    "cognitive-modeling",
    "longitudinal-data",
    "model-recovery",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.15",
]

[project.urls]
Homepage = "https://github.com/aeronjl/unspool"
Issues = "https://github.com/aeronjl/unspool/issues"
Repository = "https://github.com/aeronjl/unspool"

[project.optional-dependencies]
nwb = [
    "h5py>=3.11",
    "pynwb>=3.1",
]
dandi = [
    "h5py>=3.11",
    "pynwb>=3.1",
    "remfile>=0.1",
]
ibl = [
    "one-api>=3.5,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.10.12,<0.12.0"

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
