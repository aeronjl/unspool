[project]
name = "behavio"
version = "0.1.0"
description = "Fit and falsify trial-level models of behaviour - psychometric curves, GLM-HMMs, drift-diffusion models of choice and response time, reinforcement-learning agents, and hierarchical learning trajectories - with simulation, parameter and model recovery, and time-aware validation built into the fitting interface."
readme = "README.md"
authors = [
    { name = "Aeron Laffere" },
]
requires-python = ">=3.11"
license = "MIT"
keywords = [
    "behavioral-neuroscience",
    "cognitive-modeling",
    "drift-diffusion",
    "glm-hmm",
    "longitudinal-data",
    "model-recovery",
    "psychometric-function",
    "reinforcement-learning",
    "response-time",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.15",
]

[project.urls]
Homepage = "https://github.com/aeronjl/behavio"
Issues = "https://github.com/aeronjl/behavio/issues"
Repository = "https://github.com/aeronjl/behavio"

[project.scripts]
behavio = "behavio.cli:main"

# Licence notice for every optional dependency.
#
# Behavio is MIT, and a user who runs `pip install behavio[...]` should not discover
# afterwards that their environment now contains a non-commercial or copyleft library. The
# ecosystem this package sits in makes that a live risk: HSSM is Brown University
# non-commercial, cpm-toolbox is AGPL, keypoint-moseq is Harvard academic-use-only, and
# psignifit, metadpy, hBayesDM and pyhgf are GPL. None of them is depended on here, and the
# rule that keeps it that way is written down rather than assumed:
#
#   1. Every extra below is permissively licensed -- MIT, BSD-3-Clause, Apache-2.0, or the
#      HDF Group's BSD-style terms -- so no extra changes a user's obligations.
#   2. An extra whose licence is *not* permissive must carry a notice on its own line here,
#      name the licence in its wrapper's module docstring, and appear in the matrix in
#      `docs/foreign-models.md` before it is added.
#   3. Reading a file format is not using a package. Behavio reads DeepLabCut, SLEAP,
#      Keypoint-MoSeq and BORIS *outputs* with its own code and imports none of them.
#
# The per-extra licences, checked against each project's published metadata:
#   readers        h5py BSD-3-Clause, pandas BSD-3-Clause, tables BSD-3-Clause
#   nwb, dandi     pynwb BSD-3-Clause, remfile MIT
#   ibl            one-api MIT
#   optimization   pybads BSD-3-Clause
#   probabilistic  arviz Apache-2.0
#   bayesian       pymc Apache-2.0
#   parquet        pyarrow Apache-2.0
#   plots          matplotlib PSF-based (BSD-compatible)
#   pyddm          pyddm MIT
[project.optional-dependencies]
readers = [
    "h5py>=3.11",
    "pandas>=2.2",
    "tables>=3.10",
]
nwb = [
    "h5py>=3.11",
    "pynwb>=3.1",
]
dandi = [
    "h5py>=3.11",
    "pynwb>=3.1",
    "remfile>=0.1",
]
ibl = [
    "one-api>=3.5,<4",
]
optimization = [
    "pybads>=1.0.6,<2",
]
probabilistic = [
    "arviz>=0.22,<1.2 ; python_full_version < '3.12'",
    "arviz>=1.2,<2 ; python_full_version >= '3.12'",
]
bayesian = [
    "pymc>=5.28,<6 ; python_full_version < '3.12'",
    "pymc>=6.1,<7 ; python_full_version >= '3.12'",
]
# CSV and TSV ingest is deliberately NOT an extra: `behavio.adapters.table` reads delimited
# files with the standard library and NumPy alone, because a trial table is the baseline way
# data enters the library rather than an optional data source. Parquet is a binary container
# that genuinely needs a reader, so it is the one tabular format behind an extra.
parquet = [
    "pyarrow>=17",
]
# `behavio.plot` renders the reports the rest of the package produces. matplotlib is an
# extra rather than a core dependency because fitting, auditing, and scoring never need it;
# only calling a plotting function does, and that call raises `MatplotlibUnavailableError`
# naming this extra when it is absent.
plots = [
    "matplotlib>=3.9",
]
# `behavio.foreign.pyddm` wraps PyDDM's adaptive Navarro-Fuss first-passage density, which
# is more accurate than the fixed twelve-term series in `behavio.models.ddm` and is
# maintained by someone else. PyDDM is MIT, like Behavio, so this extra adds no obligation.
# The range is a *series* pin rather than a lower bound: the supported series is written
# into the wrapper's `signature`, because a solver whose numerics changed is not the same
# model under the same parameters. See `docs/foreign-models.md`.
pyddm = [
    "pyddm>=0.9,<0.10",
]

[dependency-groups]
dev = [
    # arviz and pymc mirror the `probabilistic` and `bayesian` extras exactly, including
    # their 3.11/3.12 split, so the default test run executes the posterior stack instead
    # of skipping past it. `arviz-stats` is deliberately absent: ArviZ 1.x requires it
    # transitively, and ArviZ 0.22 on 3.11 still carries `rhat`, `ess` and `loo` itself, so
    # declaring it would force a 1.x statistics API onto 0.x inference data.
    "arviz>=0.22,<1.2 ; python_full_version < '3.12'",
    "arviz>=1.2,<2 ; python_full_version >= '3.12'",
    # h5py, pandas, tables and xarray back the reader fixtures: the
    # pinned DeepLabCut, SLEAP, Keypoint-MoSeq and BORIS writer contracts, and
    # the duck-typed `movement` poses dataset.
    "h5py>=3.11",
    # matplotlib mirrors the `plots` extra so the plotting tests execute in the default run
    # instead of skipping past the only rendering of SBC bands, Pareto-k, and recovery.
    "matplotlib>=3.9",
    "pandas>=2.2",
    # pyddm mirrors the `pyddm` extra so the wrapper in `behavio.foreign` is exercised by the
    # default test run rather than skipped. `tests/test_pyddm_model.py` still gates on
    # `pytest.importorskip`, so a checkout without it skips cleanly.
    "pyddm>=0.9,<0.10",
    "pymc>=5.28,<6 ; python_full_version < '3.12'",
    "pymc>=6.1,<7 ; python_full_version >= '3.12'",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
    "tables>=3.10",
    "xarray>=2025.1",
]
docs = [
    "matplotlib>=3.9",
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.29",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.10.12,<0.12.0"

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers", "-m", "not slow and not benchmark"]
markers = [
    "slow: re-executes a committed benchmark at its committed scale; run nightly, not by default",
    # The benchmarks were written before the library's design settled, so they pin an API and
    # a set of numbers that the design work keeps invalidating -- which made them a brake on
    # exactly the work they were meant to support. They are deselected by default and will be
    # re-run against the finished library. Run them with `-m benchmark`.
    "benchmark: asserts against a committed benchmark artifact; re-run once the design settles",
]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
