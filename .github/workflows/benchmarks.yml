name: Benchmarks

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-benchmark-contracts:
    name: Offline benchmark contracts
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.12"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync locked environment
        run: uv sync --locked --all-groups --python 3.12

      - name: Check published parity against other people's papers
        run: uv run pytest tests/test_published_parity.py

      - name: Re-run offline benchmarks at committed scale
        run: uv run pytest -m slow

      - name: Check every committed figure matches the locked plotting stack
        run: |
          uv run python -m benchmarks.cell2025.fetch_data
          uv run python -m benchmarks.cell2025_flagship.fetch_released_artifacts
          uv run --group docs python -m scripts.plot_documentation_figures
          git diff --exit-code -- docs/assets
