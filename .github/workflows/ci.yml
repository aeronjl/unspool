name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.12"
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync locked environment
        run: uv sync --locked --all-groups --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

      - name: Build distributions
        if: matrix.python-version == '3.12'
        run: uv build

  interoperability:
    name: Data interoperability
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.12"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync interoperability extras
        run: uv sync --locked --all-groups --extra nwb --extra dandi --extra ibl --python 3.12

      - name: Test optional adapters
        run: uv run pytest tests/test_nwb_adapter.py tests/test_dandi_adapter.py tests/test_ibl_one_adapter.py

  optimization-interoperability:
    name: Optimization interoperability
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.12"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync optimization extra
        run: uv sync --locked --all-groups --extra optimization --python 3.12

      - name: Test optional optimization backend
        run: uv run pytest tests/test_pybads_backend.py

  probabilistic-interoperability:
    name: Probabilistic interoperability Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.12"
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync probabilistic extra
        run: uv sync --locked --all-groups --extra probabilistic --python ${{ matrix.python-version }}

      - name: Test labelled posterior interchange and diagnostics
        run: >-
          uv run pytest
          tests/test_posterior.py
          tests/test_posterior_diagnostics.py
          tests/test_posterior_loo.py

  bayesian-interoperability:
    name: Bayesian interoperability Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.12"
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync Bayesian extra
        run: uv sync --locked --all-groups --extra bayesian --python ${{ matrix.python-version }}

      - name: Test real PyMC backend
        run: uv run pytest tests/test_pymc_backend.py
